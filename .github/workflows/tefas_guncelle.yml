name: TEFAS Gunluk Veri Guncelle

on:
  schedule:
    # Sabah 06:50 UTC = 09:50 TSİ (TEFAS ilk sabah verisi düştüğü an)
    - cron: '50 6 * * 1-5'
    # Sabah 07:05 UTC = 10:05 TSİ (TEFAS sabah fiyatları sisteme tam oturduğunda)
    - cron: '5 7 * * 1-5'
    # Sabah 07:30 UTC = 10:30 TSİ (Geciken fonlar için ikinci sabah kontrolü)
    - cron: '30 7 * * 1-5'
    # Öğlen 10:00 UTC = 13:00 TSİ (13:30 emir penceresi öncesi taze veri)
    - cron: '0 10 * * 1-5'
    # Akşam 16:30 UTC = 19:30 TSİ (Gün sonu resmi TEFAS bülteni)
    - cron: '30 16 * * 1-5'
    # Gece 18:30 UTC = 21:30 TSİ (Geciken fonlar için gece kapanış kontrolü)
    - cron: '30 18 * * 1-5'
    # Hafta sonu Cumartesi 17:00 UTC = 20:00 TSİ
    - cron: '0 17 * * 6'
  workflow_dispatch:



    # Manuel tetikleme - GitHub Actions sayfasindan "Run workflow" butonu

jobs:
  veri-guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: TEFAS verilerini cek
        run: |
          python fetch_tefas.py
          python fetch_portfoy.py
          python fetch_valor.py

      - name: Degisiklikleri kaydet ve gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiyat_cache.json portfoy_cache.json valor_cache.json
          git diff --staged --quiet || git commit -m "TEFAS guncelleme: $(date '+%Y-%m-%d %H:%M')"
          git push
