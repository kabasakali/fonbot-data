name: TEFAS Gunluk Veri Guncelle

on:
  schedule:
    # Her gun 16:30 UTC = 19:30 Turkiye (Pazartesi-Cuma)
    - cron: '30 16 * * 1-5'
    # Hafta sonu piyasa kapali, Cuma verisini taze tutmak icin Cumartesi de calistirir
    - cron: '0 17 * * 6'
  workflow_dispatch:
    # Manuel tetikleme - GitHub Actions sayfasindan "Run workflow" butonu

jobs:
  veri-guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: TEFAS verilerini cek
        run: |
          python fetch_tefas.py
          python fetch_portfoy.py
          python fetch_valor.py

      - name: Degisiklikleri kaydet ve gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiyat_cache.json portfoy_cache.json valor_cache.json
          git diff --staged --quiet || git commit -m "TEFAS guncelleme: $(date '+%Y-%m-%d %H:%M')"
          git push
